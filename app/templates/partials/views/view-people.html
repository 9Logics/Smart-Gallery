<div id="view-people" class="view-section">
                    <!-- Master List -->
                    <div id="people-list-container">
                        <div class="section-header">
                            <h2>People</h2>
                            <span class="section-subtitle">Grouped automatically by facial recognition</span>
                        </div>
                        

                        <div class="people-grid" id="people-grid-root" style="margin-bottom: 40px;">
                            <!-- Loaded dynamically -->
                        </div>
                        
                        <div id="unnamed-people-section">

                            <div class="people-grid" id="unnamed-people-grid-root">
                                <!-- Loaded dynamically -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- Detail View -->
                    <div id="person-detail-container" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
                        <div class="section-header" style="flex-shrink: 0; border-bottom: none; padding-bottom: 0;">
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <button id="person-back-btn" class="btn btn-secondary">
                                    <i data-lucide="arrow-left" style="width: 16px; height: 16px; margin-right: 6px;"></i> Back
                                </button>
                                <h2 id="person-detail-title" style="display: none;">Person Name</h2>
                            </div>
                        </div>
                        
                        <div class="photos-container" id="person-detail-scroll-area" style="flex-grow: 1; overflow-y: auto;">
                            <!-- Hero Section -->
                            <div class="person-hero-header" style="display: flex; align-items: center; justify-content: center; gap: 24px; padding: 20px 20px 30px;">
                                <div class="person-feature-photo" id="person-hero-avatar-container" style="width: 100px; height: 100px; border-radius: 50%; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.3); cursor: pointer; position: relative;" title="Change feature photo">
                                    <img id="person-hero-avatar" src="" style="width: 100%; height: 100%; object-fit: cover;" alt="Avatar">
                                    <div class="edit-avatar-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; color: white;">
                                        <i data-lucide="camera" style="width: 32px; height: 32px;"></i>
                                    </div>
                                </div>
                                
                                <div class="person-name-container">
                                    <h1 id="person-hero-name" class="editable-hero-name" style="font-size: 48px; font-weight: 700; margin: 0; line-height: 1.1; cursor: text; padding: 4px 12px; border-radius: 8px; transition: background 0.2s;" title="Click to rename">
                                        Person Name
                                    </h1>
                                </div>
                            </div>
                            
                            <!-- Highlights Row -->
                            <div id="person-highlights-container" style="display: flex; gap: 16px; padding: 10px 20px 30px; margin-top: -10px; overflow-x: auto; scroll-snap-type: x mandatory;">
                                <!-- Loaded dynamically -->
                            </div>
                            
                            <!-- Grid -->
                            <div id="person-detail-grid">
                                <!-- Photos loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
